name: WiredCIO Deploy

# Deploys to the WiredCIO production VM (vm-paperclip) on every push to
# wiredcio/deploy. There is deliberately no approval gate here: merging to
# this branch IS the deploy trigger. See doc/RELEASING-WIREDCIO.md for the
# safety model this relies on instead (a branch ruleset requiring `ci /
# verify` to pass before a PR can merge).
#
# This job runs on a self-hosted runner installed directly on vm-paperclip
# (label: wiredcio-deploy), not a GitHub-hosted runner. That's not
# incidental: vm-paperclip's NSG only allows SSH from a handful of known
# static IPs, and GitHub-hosted runners come from a pool of ~7,000+
# constantly-rotating CIDR ranges that can never be fully allowlisted. A
# self-hosted runner polls GitHub over an outbound connection, so no inbound
# access to the VM is needed at all -- the NSG stays exactly as narrow as it
# was before this pipeline existed. The tradeoff, and the reason this
# runner's installation was deliberately not automated, is that anything
# able to schedule a job against the `wiredcio-deploy` label can execute
# code on this VM.
#
# Gated to the WiredCIO fork only, mirroring how upstream's own workflows
# (release.yml, docker.yml) gate to paperclipai/paperclip.

on:
  push:
    branches:
      - wiredcio/deploy

permissions:
  contents: read

concurrency:
  group: wiredcio-deploy
  cancel-in-progress: false

jobs:
  # Build the production image on a GitHub-hosted runner and push it to GHCR.
  # Building on vm-paperclip took 15-20 minutes on the production box, threw
  # away its own build cache to fit the disk, and on 2026-11-06 failed three
  # deploys in a row (disk full twice, then this job's 20-minute timeout).
  # See doc/plans/2026-11-06-ci-built-deploy-image.md.
  build-image:
    if: github.repository == 'WiredCIO/paperclip'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The image is ~17 GB; a stock runner has ~14 GB free. Same cleanup
      # docker.yml uses for the upstream image.
      - name: Free runner disk
        run: |
          set -euo pipefail
          df -h /
          sudo apt-get clean || true
          sudo rm -rf             /usr/share/dotnet             /usr/share/swift             /usr/local/lib/android             /usr/local/share/boost             /usr/local/share/powershell             /opt/ghc             /opt/hostedtoolcache/CodeQL             /opt/hostedtoolcache/PyPy             /opt/hostedtoolcache/Ruby || true
          docker system prune -af || true
          df -h /

      - name: Compute tool cache epoch
        id: tools-epoch
        run: echo "epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `cloud` is the stage `docker compose build server` produced on the VM
      # (the Dockerfile's last stage). The registry cache is used instead of
      # type=gha, which is capped at 10 GB per repo; this build's cache is
      # ~28 GB. The deploy- prefix keeps these tags apart from upstream's.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: cloud
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            CLI_TOOLS_CACHE_EPOCH=${{ steps.tools-epoch.outputs.epoch }}
          tags: ghcr.io/wiredcio/paperclip:deploy-${{ github.sha }}
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/wiredcio/paperclip:deploy-buildcache
          cache-to: type=registry,ref=ghcr.io/wiredcio/paperclip:deploy-buildcache,mode=max

  deploy:
    needs: build-image
    if: github.repository == 'WiredCIO/paperclip'
    runs-on: [self-hosted, wiredcio-deploy]
    # Pull, restart and health check take a few minutes. The headroom covers
    # the on-VM build fallback (a rollback to a commit CI never built): a cold
    # build of the 17 GB image takes 20-30 minutes, so leave room for a full
    # rebuild plus rollback.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy
        env:
          WIREDCIO_DEPLOY_IMAGE_REPO: ghcr.io/wiredcio/paperclip
          WIREDCIO_DEPLOY_TRIGGER_SHA: ${{ github.sha }}
          # This run's own token: short-lived, read-only for packages, and
          # never written to the runner's docker config.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /opt/paperclip/scripts/wiredcio-deploy.sh
