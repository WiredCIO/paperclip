name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci'
    # WiredCIO deploy: call this branch's own reviewed pr-trusted.yml. Upstream's
    # copy (paperclipai/paperclip@master) moves ahead of the deploy branch and runs
    # steps whose scripts it does not have yet, so it fails every PR regardless of
    # its code. The ruleset on wiredcio/deploy requires review, like upstream master.
    uses: WiredCIO/paperclip/.github/workflows/pr-trusted.yml@wiredcio/deploy
